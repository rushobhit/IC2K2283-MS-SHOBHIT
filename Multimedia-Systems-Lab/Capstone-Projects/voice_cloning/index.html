<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talking Tom - Voice Mimic</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-wrapper">
        <!-- Top Nav -->
        <header class="top-nav">
            <div class="brand">
                <span class="brand-emoji">🐱</span>
                <div class="brand-title">
                    <h1>TALKING TOM</h1>
                    <span class="brand-sub">Instant Voice Mimic</span>
                </div>
            </div>
        </header>

        <!-- Main Character Stage -->
        <main class="stage-card">
            <!-- Speech Bubble -->
            <div class="speech-bubble" id="speechBubble">
                <div class="bubble-meta">
                    <span class="bubble-tag" id="bubbleTag">Tom is listening...</span>
                </div>
                <div class="bubble-content" id="bubbleContent">
                    "Say something to Tom, and he will repeat it immediately!"
                </div>
            </div>

            <!-- Talking Tom Interactive Avatar -->
            <div class="tom-viewport" id="tomViewport">
                <svg viewBox="0 0 300 320" class="tom-cat-svg" id="tomCatSvg">
                    <defs>
                        <!-- Glow Aura -->
                        <radialGradient id="tomAura" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.35" id="aura1" />
                            <stop offset="100%" stop-color="#11998e" stop-opacity="0" />
                        </radialGradient>
                        <!-- Cat Fur Gradient -->
                        <linearGradient id="furGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#78716c" />
                            <stop offset="50%" stop-color="#57534e" />
                            <stop offset="100%" stop-color="#44403c" />
                        </linearGradient>
                        <!-- Ear Pink Gradient -->
                        <linearGradient id="earInnerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#f472b6" />
                            <stop offset="100%" stop-color="#db2777" />
                        </linearGradient>
                        <!-- Eye Iris -->
                        <linearGradient id="eyeIris" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#34d399" />
                            <stop offset="100%" stop-color="#059669" />
                        </linearGradient>
                    </defs>

                    <!-- Aura -->
                    <circle cx="150" cy="160" r="135" fill="url(#tomAura)" class="avatar-aura" id="avatarAura" />

                    <!-- Ears -->
                    <g id="earsGroup">
                        <!-- Left Ear -->
                        <g id="earLeft">
                            <path d="M 75 110 L 38 38 Q 80 48 105 85 Z" fill="url(#furGradient)" stroke="#292524" stroke-width="3" />
                            <path d="M 70 100 L 46 50 Q 76 58 95 85 Z" fill="url(#earInnerGradient)" />
                        </g>
                        <!-- Right Ear -->
                        <g id="earRight">
                            <path d="M 225 110 L 262 38 Q 220 48 195 85 Z" fill="url(#furGradient)" stroke="#292524" stroke-width="3" />
                            <path d="M 230 100 L 254 50 Q 224 58 205 85 Z" fill="url(#earInnerGradient)" />
                        </g>
                    </g>

                    <!-- Head Base -->
                    <ellipse cx="150" cy="165" rx="86" ry="80" fill="url(#furGradient)" stroke="#292524" stroke-width="3.5" />

                    <!-- Cheeks Fur Fluffs -->
                    <path d="M 64 168 L 38 178 L 66 188 L 42 198 L 74 202 Z" fill="url(#furGradient)" stroke="#292524" stroke-width="2" />
                    <path d="M 236 168 L 262 178 L 234 188 L 258 198 L 226 202 Z" fill="url(#furGradient)" stroke="#292524" stroke-width="2" />

                    <!-- Tabby Markings -->
                    <path d="M 150 100 L 146 115 L 154 115 Z" fill="#292524" opacity="0.6" />
                    <path d="M 138 105 L 135 116 L 141 116 Z" fill="#292524" opacity="0.5" />
                    <path d="M 162 105 L 159 116 L 165 116 Z" fill="#292524" opacity="0.5" />

                    <!-- Eyes -->
                    <!-- Left Eye -->
                    <g id="leftEye">
                        <ellipse cx="114" cy="140" rx="24" ry="28" fill="#ffffff" stroke="#292524" stroke-width="2.5" />
                        <ellipse cx="116" cy="140" rx="15" ry="19" fill="url(#eyeIris)" />
                        <circle cx="118" cy="140" r="9" fill="#0c0a09" />
                        <circle cx="114" cy="134" r="4" fill="#ffffff" />
                        <circle cx="121" cy="144" r="2" fill="#ffffff" />
                        <path d="M 90 138 Q 114 110 138 138" fill="none" stroke="#292524" stroke-width="3" />
                    </g>

                    <!-- Right Eye -->
                    <g id="rightEye">
                        <ellipse cx="186" cy="140" rx="24" ry="28" fill="#ffffff" stroke="#292524" stroke-width="2.5" />
                        <ellipse cx="184" cy="140" rx="15" ry="19" fill="url(#eyeIris)" />
                        <circle cx="182" cy="140" r="9" fill="#0c0a09" />
                        <circle cx="178" cy="134" r="4" fill="#ffffff" />
                        <circle cx="185" cy="144" r="2" fill="#ffffff" />
                        <path d="M 162 138 Q 186 110 210 138" fill="none" stroke="#292524" stroke-width="3" />
                    </g>

                    <!-- Muzzle -->
                    <ellipse cx="150" cy="188" rx="43" ry="30" fill="#f5f5f4" stroke="#d6d3d1" stroke-width="2" />

                    <!-- Nose -->
                    <path d="M 142 173 Q 150 168 158 173 Q 150 184 142 173 Z" fill="#ec4899" />

                    <!-- Whiskers -->
                    <g stroke="#a8a29e" stroke-width="2" stroke-linecap="round">
                        <line x1="85" y1="180" x2="32" y2="175" />
                        <line x1="85" y1="190" x2="28" y2="192" />
                        <line x1="85" y1="200" x2="38" y2="210" />

                        <line x1="215" y1="180" x2="268" y2="175" />
                        <line x1="215" y1="190" x2="272" y2="192" />
                        <line x1="215" y1="200" x2="262" y2="210" />
                    </g>

                    <!-- Talking Mouth (Animated via Web Audio) -->
                    <g id="mouthGroup">
                        <!-- Closed smile -->
                        <path d="M 132 195 Q 150 205 168 195" fill="none" stroke="#292524" stroke-width="3.5" stroke-linecap="round" id="mouthClosed" />
                        <!-- Open mouth for speaking -->
                        <path d="M 134 195 Q 150 226 166 195 Q 150 190 134 195 Z" fill="#b91c1c" stroke="#292524" stroke-width="2.5" id="mouthOpen" style="display:none;" />
                        <path d="M 142 208 Q 150 221 158 208 Z" fill="#f472b6" id="mouthTongue" style="display:none;" />
                    </g>
                </svg>

                <div class="avatar-status-pill" id="avatarStatusPill">
                    <span class="status-dot"></span>
                    <span id="avatarStatusText">Tom is waiting for you...</span>
                </div>
            </div>

            <!-- Audio Waveform Oscilloscope -->
            <div class="waveform-box">
                <canvas id="waveformCanvas" width="480" height="60"></canvas>
            </div>

            <!-- Primary Record Controls -->
            <div class="controls-area">
                <div class="main-buttons-row">
                    <!-- Big Mic Button -->
                    <button class="btn-mic-main" id="btnMic">
                        <div class="mic-icon-circle">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                            </svg>
                        </div>
                        <div class="mic-btn-text">
                            <span class="mic-title" id="micBtnTitle">TAP OR HOLD TO TALK</span>
                            <span class="mic-sub" id="micBtnSub">Speak a few words to hear Tom echo</span>
                        </div>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
